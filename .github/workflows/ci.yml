name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-check:
    name: fmt-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C target-feature=+simd128
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown -p phx-wasm

  cargo-deny:
    name: cargo-deny (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: licenses advisories

  oracle:
    name: oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for committed references
        id: refs
        working-directory: tools/oracle
        run: |
          count=$(find references -name '*.json' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "::notice::no reference JSON under tools/oracle/references -- oracle job skipped"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.refs.outputs.count != '0'
      - uses: Swatinem/rust-cache@v2
        if: steps.refs.outputs.count != '0'
      - name: Build oracle-bridge (release)
        if: steps.refs.outputs.count != '0'
        run: cargo build --release -p oracle-bridge
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install oracle (diffing the committed references needs no Praat/parselmouth)
        working-directory: tools/oracle
        run: uv sync
      - name: Unit-test the oracle's own logic
        working-directory: tools/oracle
        run: uv run python -m unittest discover -s tests -t .
      - name: Run oracle-bridge over the committed fixtures
        if: steps.refs.outputs.count != '0'
        run: |
          rm -rf /tmp/oracle-candidate
          ./target/release/oracle-bridge --out-dir /tmp/oracle-candidate
      - name: Diff the Rust candidate output against the committed references
        if: steps.refs.outputs.count != '0'
        working-directory: tools/oracle
        run: uv run oracle diff-all --measured-dir /tmp/oracle-candidate
