name: Release desktop

# Builds the Tauri desktop app for macOS, Windows, and Linux and publishes the
# installers to a GitHub Release. Trigger by pushing a `desktop-v*` tag, or run
# it by hand from the Actions tab (workflow_dispatch).
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # A universal binary covers both Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install workspace dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-v__VERSION__' }}
          releaseName: 'Phonia Desktop v__VERSION__'
          releaseBody: |
            Offline desktop build of Phonia. Download the installer for your platform:

            - **macOS** — the `.dmg` (universal, Apple Silicon and Intel)
            - **Windows** — the `.exe` (setup) or `.msi`
            - **Linux** — the `.AppImage` (portable) or `.deb`
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
