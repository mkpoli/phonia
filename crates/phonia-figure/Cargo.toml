[package]
name = "phonia-figure"
version = "0.0.1"
edition.workspace = true
# The crate's own code is MIT OR Apache-2.0 like the rest of the workspace.
# It also bundles DejaVu Sans 2.37 (assets/fonts/), whose licence
# (LICENSE-DejaVu.txt, verbatim from upstream) is the Bitstream Vera Fonts
# licence (SPDX `Bitstream-Vera`) plus a notice in the same terms for glyphs
# imported from Arev fonts, which has no SPDX identifier; DejaVu's own changes
# are public domain.
license = "(MIT OR Apache-2.0) AND Bitstream-Vera"
description = "Backend-agnostic figure model and exporters: SVG scene graph with PNG and PDF derived from it"

[dependencies]
# Optional: only the `analysis` feature's conversion helpers (builder.rs) and
# the reference-figure test/example support need a live analysis result, so a
# consumer wanting just the figure model and exporters does not pull these in.
phonia-audio = { workspace = true, optional = true }
phonia-spectrogram = { workspace = true, optional = true }
phonia-pitch = { workspace = true, optional = true }
phonia-formant = { workspace = true, optional = true }
phonia-intensity = { workspace = true, optional = true }
phonia-textgrid = { workspace = true, optional = true }
phonia-annot = { workspace = true }
phonia-render = { workspace = true }
serde = { workspace = true }
# float_roundtrip makes JSON deserialization recover f64 bit-for-bit, so a
# serialize -> deserialize -> serialize cycle is byte-identical.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# SVG is the scene-graph source of truth. It embeds the colorized spectrogram
# as a base64 PNG, so base64 and png compile for every target including
# wasm32; both are pure Rust.
base64 = { workspace = true }
png = { workspace = true }
# PNG and PDF derive from the SVG by rasterizing / converting it. resvg and
# svg2pdf pull tiny-skia and a font stack that are native-only, so they sit
# behind features left off on the wasm build.
resvg = { workspace = true, optional = true }
svg2pdf = { workspace = true, optional = true }

[features]
default = []
# Builds Layer from a live analysis result: spectrogram_layer, pitch_layer,
# formant_layer, intensity_layer, spectral_slice_layer, and the
# reference-figure fixture used by tests and examples.
analysis = [
    "dep:phonia-audio",
    "dep:phonia-spectrogram",
    "dep:phonia-pitch",
    "dep:phonia-formant",
    "dep:phonia-intensity",
    "dep:phonia-textgrid",
]
# to_png: rasterize the SVG scene with resvg + tiny-skia.
raster = ["dep:resvg"]
# to_pdf: convert the SVG scene with svg2pdf.
pdf = ["dep:svg2pdf"]

[[example]]
name = "render_reference"
required-features = ["analysis", "raster", "pdf"]

[[example]]
name = "emit_text_exports"
required-features = ["analysis"]

[[test]]
name = "backends"
required-features = ["analysis"]

[[test]]
name = "text_backends"
required-features = ["analysis"]
