[package]
name = "phonia-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Planar f32 audio buffers with WAV, AIFF, FLAC and MP3 decoding and Praat-compatible resampling"
documentation = "https://docs.rs/phonia-audio"
readme = "README.md"
keywords = ["audio", "wav", "flac", "resampling", "phonetics"]
categories = ["multimedia::audio", "science"]

[dependencies]
hound = { workspace = true }
phonia-dsp = { workspace = true }
rubato = { workspace = true }
symphonia = { workspace = true, default-features = false, features = [
    "aiff",
    "flac",
    "mp3",
    "pcm",
] }
