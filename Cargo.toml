[workspace]
resolver = "3"
members = [
    "crates/phonia-audio",
    "crates/phonia-dsp",
    "crates/phonia-spectrogram",
    "crates/phonia-pitch",
    "crates/phonia-formant",
    "crates/phonia-intensity",
    "crates/phonia-voice",
    "crates/phonia-annot",
    "crates/phonia-textgrid",
    "crates/phonia-render",
    "crates/phonia-figure",
    "crates/phonia-project",
    "crates/phonia-playback",
    "crates/phonia-engine",
    "crates/phonia-wasm",
    "crates/phonia",
    "tools/oracle-bridge",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkpoli/phonia"
homepage = "https://phonia.app"

[workspace.dependencies]
hound = "3.5"
symphonia = { version = "0.6", default-features = false }
cpal = "0.18"
rubato = "4"
rustfft = "6.4"
realfft = "3.5"
ndarray = "0.16"
wasm-bindgen = "0.2.126"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
blake3 = "1"
base64 = "0.22"
png = "0.17"
resvg = "0.45"
svg2pdf = "0.13"
phonia-audio = { path = "crates/phonia-audio", version = "0.1.0" }
phonia-dsp = { path = "crates/phonia-dsp", version = "0.1.0" }
phonia-spectrogram = { path = "crates/phonia-spectrogram", version = "0.1.0" }
phonia-pitch = { path = "crates/phonia-pitch", version = "0.1.0" }
phonia-formant = { path = "crates/phonia-formant", version = "0.1.0" }
phonia-intensity = { path = "crates/phonia-intensity", version = "0.1.0" }
phonia-voice = { path = "crates/phonia-voice", version = "0.1.0" }
phonia-annot = { path = "crates/phonia-annot", version = "0.1.0" }
phonia-textgrid = { path = "crates/phonia-textgrid", version = "0.1.0" }
phonia-render = { path = "crates/phonia-render", version = "0.0.1" }
phonia-figure = { path = "crates/phonia-figure", version = "0.0.1" }
phonia-project = { path = "crates/phonia-project", version = "0.0.1" }
phonia-playback = { path = "crates/phonia-playback", version = "0.0.1" }
phonia-engine = { path = "crates/phonia-engine", version = "0.0.1" }
phonia-wasm = { path = "crates/phonia-wasm", version = "0.0.1" }
